[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musictools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "rapidfuzz>=3.0.0",
    "ytmusicapi>=1.7.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["musictools*"]
